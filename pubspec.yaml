name: memora
description: "Memora - Shared Memories App"
publish_to: "none"
version: 1.0.0+1
environment:
  sdk: ^3.12.2
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  # State Management
  flutter_bloc: ^9.1.1
  # Dependency Injection
  get_it: ^8.0.3
  # Functional Programming
  dartz: ^0.10.1
  # Equality
  equatable: ^2.0.7
  # Supabase
  supabase_flutter: ^2.16.0
  # Routing
  go_router: ^16.3.0
  # Environment
  flutter_dotenv: ^5.2.1
  # Local Storage
  shared_preferences: ^2.5.5
  # UUID
  uuid: ^4.6.0
  # Localization
  intl: ^0.20.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - .env
  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Regular.ttf
          weight: 400
        - asset: assets/fonts/Cairo-Medium.ttf
          weight: 500
        - asset: assets/fonts/Cairo-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Cairo-Bold.ttf
          weight: 700

    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
